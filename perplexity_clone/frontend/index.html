<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de recherche</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap');
/* Si cette police Google ne charge pas (pas d'accès Internet), le navigateur
   retombe automatiquement sur les polices système ci-dessous — l'interface
   reste fonctionnelle, juste moins soignée visuellement. */

:root{
  --bg:#0b0a08; --panel:#131110; --panel-2:#1a1713; --edge:#26221b;
  --amber:#ffb454; --amber-bright:#ffd28a; --amber-dim:#8a6a42; --amber-dimmer:#4a3a24;
  --cream:#ede6d8; --red:#ff6b5c; --green:#8fd19e;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
  font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;}
body{display:flex;height:100vh;overflow:hidden;}

#sidebar{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;padding:20px 16px;}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:20px;}
.brand-mark{width:34px;height:34px;border:1px solid var(--amber-dim);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:var(--amber);
  font-size:1.1rem;flex:none;}
.brand-title{font-size:0.86rem;font-weight:600;color:var(--amber-bright);}
.brand-sub{font-size:0.68rem;color:var(--amber-dimmer);margin-top:2px;}
#new-btn{background:transparent;border:1px solid var(--amber-dim);color:var(--amber);
  border-radius:8px;padding:10px 12px;font-family:inherit;font-size:0.8rem;
  cursor:pointer;margin-bottom:18px;text-align:left;width:100%;}
#new-btn:hover{border-color:var(--amber);background:var(--panel-2);}
#conv-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.empty{color:var(--amber-dimmer);font-size:0.76rem;padding:10px 4px;}
.conv-item{position:relative;padding:10px 30px 10px 10px;border-radius:6px;cursor:pointer;}
.conv-item:hover{background:var(--panel-2);}
.conv-item.active{background:var(--panel-2);border-left:2px solid var(--amber);}
.conv-title{font-size:0.8rem;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-date{font-size:0.66rem;color:var(--amber-dimmer);margin-top:3px;}
.conv-del{position:absolute;right:6px;top:8px;background:none;border:none;
  color:var(--amber-dimmer);font-size:1rem;cursor:pointer;padding:2px 6px;
  border-radius:4px;display:none;}
.conv-item:hover .conv-del{display:block;}
.conv-del:hover{color:var(--red);}

#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#api-warning{background:#2a1712;border-bottom:1px solid var(--red);color:var(--red);
  font-size:0.8rem;padding:9px 24px;display:none;}
#api-warning code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:4px;}
#thread{flex:1;overflow-y:auto;padding:28px 40px;}
#thread-inner{max-width:760px;margin:0 auto;}
.intro{display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  padding-top:60px;max-width:440px;}
.intro-mark{width:44px;height:44px;border:1px solid var(--amber-dim);border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:1.4rem;}
.intro p{color:var(--amber-dim);font-size:0.9rem;line-height:1.6;margin:0;}

.msg{padding:18px 0;border-bottom:1px solid var(--edge);}
.msg-label{font-size:0.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
.msg-label.user{color:var(--amber);}
.msg-label.assistant{color:var(--green);}
.msg-body{font-family:'Source Serif 4',Georgia,serif;font-size:1.05rem;line-height:1.7;
  color:var(--cream);white-space:pre-wrap;}
.msg.user .msg-body{font-family:'IBM Plex Mono',monospace;font-size:0.92rem;color:var(--amber-bright);}

.timing-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:0.72rem;color:var(--amber-dimmer);}
.timing-row b{color:var(--amber-dim);font-weight:600;}

.sources{margin-top:14px;border-top:1px solid var(--edge);padding-top:10px;}
.sources-title{font-size:0.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--amber-dim);margin-bottom:8px;}
.sources ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.sources li{font-size:0.76rem;display:flex;gap:8px;align-items:baseline;}
.src-n{color:var(--amber-dim);flex:none;}
.sources a{color:var(--amber);text-decoration:none;word-break:break-all;}
.sources a:hover{text-decoration:underline;}

.ledger{background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;
  padding:14px 16px;margin-top:10px;max-width:340px;}
.ledger-title{font-size:0.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber-dim);margin-bottom:10px;}
.ledger-row{display:flex;align-items:center;gap:9px;font-size:0.82rem;padding:4px 0;color:var(--amber-dimmer);}
.ledger-row.current{color:var(--amber-bright);}
.ledger-row.done{color:var(--amber-dim);}
.ledger-dot{width:6px;height:6px;border-radius:50%;background:var(--amber-dimmer);flex:none;}
.ledger-row.current .ledger-dot{background:var(--amber);box-shadow:0 0 6px var(--amber);
  animation:pulse 1.1s ease-in-out infinite;}
.ledger-row.done .ledger-dot{background:var(--amber-dim);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

#composer{display:flex;gap:10px;padding:16px 40px 24px;}
#composer-inner{display:flex;gap:10px;max-width:760px;margin:0 auto;width:100%;}
#input{flex:1;resize:none;background:var(--panel);border:1px solid var(--edge);border-radius:10px;
  color:var(--cream);font-family:'IBM Plex Mono',monospace;font-size:0.88rem;padding:12px 14px;
  outline:none;}
#input:focus{border-color:var(--amber-dim);}
#send-btn{background:var(--amber);color:#181410;border:none;border-radius:10px;padding:0 20px;
  font-family:inherit;font-size:0.85rem;font-weight:600;cursor:pointer;}
#send-btn:disabled{background:var(--amber-dimmer);color:var(--panel);cursor:not-allowed;}
</style>
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-mark">§</div>
    <div>
      <div class="brand-title">Carnet de recherche</div>
      <div class="brand-sub">assistant local · sans coût</div>
    </div>
  </div>
  <button id="new-btn">+ Nouvelle recherche</button>
  <div id="conv-list"></div>
</div>

<div id="main">
  <div id="api-warning"></div>
  <div id="thread"><div id="thread-inner"></div></div>
  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" rows="1" placeholder="Pose ta question de recherche…"></textarea>
      <button id="send-btn">Envoyer</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   Carnet de recherche — interface en JavaScript pur (aucune dépendance
   externe : pas de React, pas de CDN). Tout le rendu est fait à la main
   via de simples manipulations du DOM, organisé par "composants"
   (fonctions de rendu), dans l'esprit de React mais sans la librairie.
   ========================================================================== */

const API = "http://localhost:8000";

const STEP_LABELS = {
  decompose: "Décomposition de la question",
  search: "Recherche web",
  scrape: "Lecture des pages",
  chunk: "Découpage du contenu",
  rerank: "Tri par pertinence",
  generate: "Rédaction de la réponse",
};
const STEP_ORDER = ["decompose","search","scrape","chunk","rerank","generate"];
const LEDGER_DELAYS = [3200,1800,2600,300,9000,14000];

const state = {
  conversations: [],
  activeId: null,
  messages: [],
  loading: false,
  ledgerStep: 0,
  apiUp: null,
};

let ledgerTimer = null;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function fmtDate(ts){
  const d = new Date(ts*1000);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) + ' · ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function fmtSecs(s){ return s < 1 ? Math.round(s*1000)+'ms' : s.toFixed(1)+'s'; }

/* ---------- Rendu ---------- */

function renderSidebar(){
  const list = document.getElementById('conv-list');
  if(state.conversations.length === 0){
    list.innerHTML = '<div class="empty">Aucune recherche enregistrée pour l\'instant.</div>';
    return;
  }
  list.innerHTML = state.conversations.map(c => `
    <div class="conv-item ${c.id === state.activeId ? 'active' : ''}" data-id="${esc(c.id)}">
      <div class="conv-title">${esc(c.title)}</div>
      <div class="conv-date">${esc(fmtDate(c.created_at))}</div>
      <button class="conv-del" data-del="${esc(c.id)}" title="Supprimer">×</button>
    </div>
  `).join('');

  list.querySelectorAll('.conv-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.conv-del')) return;
      selectConversation(el.dataset.id);
    });
  });
  list.querySelectorAll('.conv-del').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteConversation(el.dataset.del);
    });
  });
}

function renderLedger(){
  if(!state.loading) return '';
  const rows = STEP_ORDER.map((key, idx)=>{
    const cls = idx < state.ledgerStep ? 'done' : idx === state.ledgerStep ? 'current' : '';
    return `<div class="ledger-row ${cls}"><span class="ledger-dot"></span><span>${STEP_LABELS[key]}</span></div>`;
  }).join('');
  return `<div class="ledger"><div class="ledger-title">Registre du pipeline</div>${rows}</div>`;
}

function renderMessage(m){
  const isUser = m.role === "user";
  let html = `<div class="msg ${isUser ? 'user' : 'assistant'}">
    <div class="msg-label ${isUser ? 'user' : 'assistant'}">${isUser ? 'Vous' : 'Assistant'}</div>
    <div class="msg-body">${esc(m.content)}</div>`;

  if(!isUser && m.timings && Object.keys(m.timings).length){
    html += `<div class="timing-row">${
      STEP_ORDER.filter(k=>m.timings[k]!==undefined)
        .map(k=>`<span>${STEP_LABELS[k]} <b>${fmtSecs(m.timings[k])}</b></span>`).join('')
    }</div>`;
  }
  if(!isUser && m.sources && m.sources.length){
    html += `<div class="sources"><div class="sources-title">Sources citées</div><ol>${
      m.sources.map(s=>`<li><span class="src-n">[${s.n}]</span><a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.url)}</a></li>`).join('')
    }</ol></div>`;
  }
  html += `</div>`;
  return html;
}

function renderThread(){
  const el = document.getElementById('thread-inner');
  if(state.messages.length === 0 && !state.loading){
    el.innerHTML = `<div class="intro">
      <div class="intro-mark">§</div>
      <p>Pose une question. La recherche s'appuie sur le web,
         le contenu est passé au crible d'un modèle tournant en local —
         aucune donnée n'est envoyée à un service tiers.</p>
    </div>`;
    return;
  }
  el.innerHTML = state.messages.map(renderMessage).join('') + renderLedger();
  document.getElementById('thread').scrollTop = document.getElementById('thread').scrollHeight;
}

function renderApiWarning(){
  const el = document.getElementById('api-warning');
  if(state.apiUp === false){
    el.style.display = 'block';
    el.innerHTML = `API locale injoignable sur ${esc(API)}. Lance <code>uvicorn api:app --reload</code> dans le dossier du projet.`;
  }else{
    el.style.display = 'none';
  }
}

function renderComposer(){
  document.getElementById('send-btn').disabled = state.loading || !document.getElementById('input').value.trim();
}

function render(){
  renderSidebar();
  renderThread();
  renderApiWarning();
  renderComposer();
}

/* ---------- Ledger animation pendant le chargement ---------- */

function startLedger(){
  state.ledgerStep = 0;
  clearTimeout(ledgerTimer);
  const tick = ()=>{
    state.ledgerStep = Math.min(state.ledgerStep + 1, STEP_ORDER.length - 1);
    renderThread();
    ledgerTimer = setTimeout(tick, LEDGER_DELAYS[state.ledgerStep] || 4000);
  };
  ledgerTimer = setTimeout(tick, LEDGER_DELAYS[0]);
}
function stopLedger(){
  clearTimeout(ledgerTimer);
}

/* ---------- Actions / appels API ---------- */

async function checkHealth(){
  try{
    const r = await fetch(API + "/health");
    state.apiUp = r.ok;
  }catch(e){ state.apiUp = false; }
  renderApiWarning();
}

async function loadConversations(){
  try{
    const r = await fetch(API + "/conversations");
    state.conversations = await r.json();
    renderSidebar();
  }catch(e){ /* API pas encore lancée */ }
}

async function selectConversation(id){
  state.activeId = id;
  const r = await fetch(`${API}/conversations/${id}/messages`);
  state.messages = await r.json();
  render();
}

function newConversation(){
  state.activeId = null;
  state.messages = [];
  document.getElementById('input').value = "";
  render();
}

async function deleteConversation(id){
  await fetch(`${API}/conversations/${id}`, {method:"DELETE"});
  if(id === state.activeId) newConversation();
  loadConversations();
}

async function send(){
  const input = document.getElementById('input');
  const query = input.value.trim();
  if(!query || state.loading) return;
  input.value = "";

  state.messages.push({role:"user", content:query, sources:[], timings:{}});
  state.loading = true;
  startLedger();
  render();

  try{
    const r = await fetch(API + "/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({query, conversation_id: state.activeId}),
    });
    const data = await r.json();
    state.activeId = data.conversation_id;
    state.messages.push({role:"assistant", content:data.answer, sources:data.sources, timings:data.timings});
    loadConversations();
  }catch(e){
    state.messages.push({
      role:"assistant",
      content:"Impossible de joindre l'API locale. Vérifie que le serveur tourne (uvicorn api:app --reload).",
      sources:[], timings:{},
    });
  }finally{
    state.loading = false;
    stopLedger();
    render();
  }
}

/* ---------- Écouteurs ---------- */

document.getElementById('new-btn').addEventListener('click', newConversation);
document.getElementById('send-btn').addEventListener('click', send);
document.getElementById('input').addEventListener('input', renderComposer);
document.getElementById('input').addEventListener('keydown', (e)=>{
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

/* ---------- Démarrage ---------- */

checkHealth();
loadConversations();
render();
</script>
</body>
</html>
