<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de recherche</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
  <div class="brand">
    <div class="brand-mark">§</div>
    <div>
      <div class="brand-title">Carnet de recherche</div>
      <div class="brand-sub">assistant local · sans coût</div>
    </div>
  </div>
  <button id="new-btn">+ Nouvelle recherche</button>
  <div id="conv-list"></div>
</div>

<div id="main">
  <div id="api-warning"></div>
  <div id="thread"><div id="thread-inner"></div></div>
  <div id="composer">
    <div id="composer-inner">
      <textarea id="input" rows="1" placeholder="Pose ta question de recherche…"></textarea>
      <button id="send-btn">Envoyer</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
